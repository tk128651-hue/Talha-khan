<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create Account | Bakerz Bite</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="assets/login.css">
<script src="assets/auth.js"></script>
<script>protectRegisterPage();</script>
</head>
<body class="login-page">
<main class="login-shell">
<section class="login-visual">
<a class="brand" href="register.html"><i class="bi bi-cake2-fill me-2"></i>Bakerz <span>Bite</span></a>
<div class="visual-content"><h1>Join the<br>sweet side.</h1><p>Create your account once. Your account details will be saved on this device for your next login.</p></div>
<small>© 2026 Bakerz Bite Bakery</small>
</section>
<section class="login-form-area"><div class="form-wrap">
<h2>Create account</h2><p class="subtitle">First time here? Register to continue.</p>
<form id="regForm">
<div class="mb-3"><label class="form-label">Full Name</label><input id="name" class="form-control" required placeholder="Your name"></div>
<div class="mb-3"><label class="form-label">Email Address</label><input id="email" type="email" class="form-control" required placeholder="you@example.com"></div>
<div class="mb-3"><label class="form-label">Password</label><input id="password" type="password" minlength="6" class="form-control" required placeholder="At least 6 characters"></div>
<div class="mb-3"><label class="form-label">Confirm Password</label><input id="confirmPassword" type="password" minlength="6" class="form-control" required placeholder="Repeat your password"></div>
<button class="login-btn" type="submit">Create Account <i class="bi bi-person-plus ms-1"></i></button>
<div id="status" class="status mt-3"></div>
</form>
<p class="text-center mt-4 mb-0 text-secondary">Already registered? <a href="login.html" class="small-link">Login</a></p>
</div></section>
</main>
<script>
document.getElementById('regForm').onsubmit=e=>{
 e.preventDefault();
 const name=document.getElementById('name').value.trim();
 const email=document.getElementById('email').value.trim().toLowerCase();
 const password=document.getElementById('password').value;
 const confirm=document.getElementById('confirmPassword').value;
 const s=document.getElementById('status');
 if(password!==confirm){s.className='status mt-3 error';s.textContent='Passwords do not match.';return;}
 localStorage.setItem(AUTH_USER_KEY,JSON.stringify({name,email,password,createdAt:new Date().toISOString()}));
 endSession();
 s.className='status mt-3 success';
 s.textContent='Account created successfully! Opening login...';
 setTimeout(()=>location.replace('login.html'),700);
};
</script>
</body></html>
